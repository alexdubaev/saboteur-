name: Import verified asset batch 01

on:
  push:
    branches: [assets/production-foundation-v1]
    paths:
      - .github/workflows/import-verified-batch-01.yml
      - tools/import_asset_batch_01.py
      - tests/test_asset_import.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-asset-import-01
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'alexdubaev/saboteur-' && github.ref == 'refs/heads/assets/production-foundation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASSET_ARCHIVE: ${{ runner.temp }}/gold-traitors-batch-01.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install Pillow==11.3.0
      - name: Fetch exact prepared archive
        run: >-
          curl --fail --location --retry 2 --max-time 90
          'https://media.base44.com/files/public/6af0cf8f1e7c1043015802ed/7da967f9f_gold-traitors-batch-01.zip'
          --output "$ASSET_ARCHIVE"
      - name: Verify importer and all image hashes before writing
        run: python -m unittest discover -s tests -p 'test_asset_import.py' -v
      - name: Import 26 images, source, preview and manifest
        run: python tools/import_asset_batch_01.py --archive "$ASSET_ARCHIVE"
      - name: Commit and publish to asset branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cards art-source/batch-01-source-atlas.png docs/previews/batch-01-contact-sheet.jpg data/asset-manifest.json data/batch-01-inventory.json data/batch-01-verification.json docs/ASSET_UPLOAD_STATUS.md docs/ASSET_QA_REPORT.md
          if git diff --cached --quiet; then
            echo 'Verified batch already present; no duplicate commit.'
            exit 0
          fi
          git commit -m 'assets: publish all 26 batch-01 WebP files and verified manifest'
          git push origin HEAD:refs/heads/assets/production-foundation-v1
