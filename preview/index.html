<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Золото и предатели — галерея ассетов</title><style>body{background:#121323;color:#f5e3bf;font:16px system-ui;margin:0;padding:24px}h1{color:#ffca4d}h2{margin-top:35px}p{color:#bfb5d6}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:14px}.card{background:#242039;border:1px solid #625075;border-radius:12px;padding:7px}.card img{width:100%;aspect-ratio:2/3;object-fit:cover}.card span{display:block;font-size:11px;word-wrap:break-word;margin:6px 2px}.wide{max-width:900px;width:100%;border-radius:20px}</style><h1>Золото и предатели — Asset QA</h1><p>Индивидуальные WebP и точная геометрия. Экраны — дизайн-референсы, не код приложения.</p><div id="app"></div><script>const paths=
["assets/cards/actions/action-break-cart.webp", "assets/cards/actions/action-break-lantern.webp", "assets/cards/actions/action-break-pickaxe.webp", "assets/cards/actions/action-collapse.webp", "assets/cards/actions/action-repair-cart.webp", "assets/cards/actions/action-repair-lantern-or-cart.webp", "assets/cards/actions/action-repair-lantern.webp", "assets/cards/actions/action-repair-pickaxe-or-cart.webp", "assets/cards/actions/action-repair-pickaxe-or-lantern.webp", "assets/cards/actions/action-repair-pickaxe.webp", "assets/cards/actions/action-scout.webp", "assets/cards/backs/deck-back.webp", "assets/cards/goals/board-start.webp", "assets/cards/goals/goal-empty-a.webp", "assets/cards/goals/goal-empty-b.webp", "assets/cards/goals/goal-gold.webp", "assets/cards/goals/goal-hidden.webp", "assets/cards/rewards/reward-gold-one.webp", "assets/cards/rewards/reward-gold-three.webp", "assets/cards/rewards/reward-gold-two.webp", "assets/cards/roles/role-prospector.webp", "assets/cards/roles/role-traitor.webp", "assets/cards/tunnels/tunnel-cross.webp", "assets/cards/tunnels/tunnel-dead-end-e.webp", "assets/cards/tunnels/tunnel-dead-end-n.webp", "assets/cards/tunnels/tunnel-separated-e-w.webp", "assets/cards/tunnels/tunnel-separated-n-s.webp", "assets/cards/tunnels/tunnel-straight-ew.webp", "assets/cards/tunnels/tunnel-straight-ns.webp", "assets/cards/tunnels/tunnel-tee-nes.webp", "assets/cards/tunnels/tunnel-tee-new.webp", "assets/cards/tunnels/tunnel-turn-ne.webp", "assets/cards/tunnels/tunnel-turn-nw.webp"];const a=document.getElementById("app");for(const cat of ["tunnels","actions","goals","roles","rewards","backs"]){const h=document.createElement("h2");h.textContent=cat;a.append(h);const grid=document.createElement("div");grid.className="cards";a.append(grid);for(const path of paths.filter(x=>x.includes("/"+cat+"/"))){const box=document.createElement("div");box.className="card";box.innerHTML=`<img loading="lazy" src="../${path}"><span>${path.split("/").pop()}</span>`;grid.append(box)}} </script></html>
